services:
  # Backend Spring Boot REST API Web Service
  - type: web
    name: train-booking-backend
    runtime: docker
    dockerContext: app
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8086
      - key: SERVER_PORT
        value: 8086
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: train-booking-db
          property: host
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: train-booking-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: train-booking-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: train-booking-db
          property: password
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${SPRING_DATASOURCE_HOST}/${SPRING_DATASOURCE_DB}
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # Frontend React Vite Nginx Web Service
  - type: web
    name: train-booking-frontend
    runtime: docker
    dockerContext: app
    dockerfilePath: Dockerfile.frontend
    plan: free
    region: singapore

databases:
  # Managed PostgreSQL Database on Render
  - name: train-booking-db
    databaseName: ticket_booking_db
    user: ticket_user
    plan: free
    region: singapore